spring:
  application:
    name: library-api
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library_user
    password: library_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
