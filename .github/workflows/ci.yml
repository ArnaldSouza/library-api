name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: library
          POSTGRES_USER: library_user
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library_user -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Create test database
        run: PGPASSWORD=ci_only_password psql -h localhost -U library_user -d library -c "CREATE DATABASE library_test;"

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test