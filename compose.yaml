services:
  db:
    image: postgres:17-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_pass
    ports:
      - 5432:5432
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: library-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/library
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library_pass
      JWT_SECRET: 5468697349734150726f6a656374536563726574466f724c6962726172794170694a5754
      JWT_EXPIRATION: 3600000
    ports:
      - 8080:8080

volumes:
  library_pgdata: